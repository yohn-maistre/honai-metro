name: Deploy ETNOS to Cloudflare Pages

# main -> production; every non-main branch -> Pages preview.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-cf-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Preview branches are allowed to resolve the deliberately pinned ETNOS
      # UI additions in CI. Main stays lockfile-strict; refresh bun.lock before
      # merging this preview branch to production.
      - name: Install dependencies (preview)
        if: github.ref != 'refs/heads/main'
        run: bun install

      - name: Install dependencies (production)
        if: github.ref == 'refs/heads/main'
        run: bun install --frozen-lockfile

      - name: Build (Cloudflare adapter)
        env:
          CF_PAGES: '1'
          PUBLIC_INSTANCE_URL: ${{ vars.PUBLIC_INSTANCE_URL || 'piefed.social' }}
          PUBLIC_INSTANCE_TYPE: ${{ vars.PUBLIC_INSTANCE_TYPE || 'piefedalpha' }}
          PUBLIC_LOCK_TO_INSTANCE: ${{ vars.PUBLIC_LOCK_TO_INSTANCE || 'true' }}
          PUBLIC_LANGUAGE: id
          PUBLIC_SSR_ENABLED: 'false'
          PUBLIC_DEFAULT_FEED: Local
          PUBLIC_DETAK_URL: ${{ vars.PUBLIC_DETAK_URL }}
        run: bun run build

      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: pages project create etnos --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: >-
            pages deploy .svelte-kit/cloudflare
            --project-name=etnos
            --branch=${{ github.ref_name }}
            --commit-dirty=true
