name: ETNOS native validation
on:
  push:
    branches: [feat/etnos-native-platform]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etnos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/etnos-native-platform'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve upstream lock on CI
        run: bun install
      - run: node scripts/check-etnos-native.mjs
      - name: Build complete Svelte application
        run: bun run build
        env:
          CF_PAGES: '1'
          PUBLIC_INSTANCE_URL: piefed.social
          PUBLIC_INSTANCE_TYPE: piefedalpha
          PUBLIC_LOCK_TO_INSTANCE: 'true'
          PUBLIC_LANGUAGE: id
          PUBLIC_SSR_ENABLED: 'false'
      - name: Prepare isolated preview
        run: node scripts/prepare-etnos-pages.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy native preview
        run: bunx wrangler pages deploy .svelte-kit/cloudflare --project-name etnos-native-lab --branch etnos-native
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etnos-native-build
          path: |
            .svelte-kit/cloudflare
            bun.lock
  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare browser checks
        run: |
          npm install --prefix /tmp/etnos-browser --no-package-lock playwright@1.58.2
          /tmp/etnos-browser/node_modules/.bin/playwright install --with-deps chromium
          cp scripts/verify-etnos-browser.mjs /tmp/etnos-browser/verify.mjs
      - name: Exercise live forum and engine
        run: node /tmp/etnos-browser/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etnos-native-browser
          path: etnos-evidence
